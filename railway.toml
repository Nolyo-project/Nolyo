# Déploiement Railway = Backend uniquement
# IMPORTANT : Settings → Root Directory = "Backend"
# (évite les échecs Railpack sur le monorepo à la racine)

[build]
builder = "NIXPACKS"
buildCommand = "npm install --omit=dev --prefix Backend"

[deploy]
startCommand = "npm start --prefix Backend"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[watch]
paths = ["Backend/**"]
