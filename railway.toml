# Déploiement Railway = Backend uniquement
# Préférable : dans Railway → Settings → Root Directory = "Backend"
# Ce fichier sert si le service pointe encore sur la racine du repo.

[build]
builder = "RAILPACK"
buildCommand = "npm install --omit=dev --prefix Backend"

[deploy]
startCommand = "npm start --prefix Backend"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[watch]
paths = ["Backend/**"]
